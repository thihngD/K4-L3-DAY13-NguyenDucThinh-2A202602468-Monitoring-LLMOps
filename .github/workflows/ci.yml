name: CI

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secret / PII scan
        run: python scripts/scan_secrets.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Start API (no Langfuse keys -> tracing disabled, local prompt fallback)
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Generate baseline traffic
        run: python scripts/load_test.py

      - name: Validate structured logs
        run: python scripts/validate_logs.py

      - name: Validate dashboard contract
        run: python scripts/validate_dashboard.py

      - name: Show server log on failure
        if: failure()
        run: cat uvicorn.log || true
