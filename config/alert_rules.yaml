alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'percentile(response_sent.latency_ms, 95) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602468
    runbook: docs/alerts.md#alert-1
  - name: LowRetrievalSuccessRate
    severity: critical
    condition: 'count(tool_success == true) / count(tool_success != null) * 100 < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602468
    runbook: docs/alerts.md#alert-2
  - name: DailyCostBudgetExceeded
    severity: warning
    condition: 'sum(response_sent.cost_usd) over 60m window > 2.5'
    duration: 10m
    type: symptom-based
    channel: slack
    owner: student-2A202602468
    runbook: docs/alerts.md#alert-3
